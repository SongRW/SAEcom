<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <title>面板</title>
    <style>
        html,
        body {
            margin: 0;
            height: 100%;
            overflow: hidden;
        }

        #root {
            height: 100%;
        }
    </style>
    <!--
      冷启动防闪烁（FOUC）：同步读 localStorage['appSettings']，在 React 挂载前提前
      应用主题类。独立窗共用默认 session，localStorage 与主窗同源共享。与 mainwindow.html
      一致，避免深色模式首帧浅色绘制（panel.tsx 的 useEffect 补主题发生在首绘之后）。
    -->
    <script>
        (function () {
            try {
                var raw = localStorage.getItem('appSettings')
                var s = raw ? JSON.parse(raw) : {}
                var el = document.documentElement
                if (s.dark) { el.classList.add('dark'); el.classList.add('theme-dark') }
            } catch (e) { /* 容错 */ }
        })()
    </script>
</head>

<body>
    <div id="root"></div>

    <!-- Web 预览安全网：非 Electron 环境下注入 window.api shim（Electron 中 preload 已注入，此文件自动跳过） -->
    <script src="/src/shared/dev/mock-api.ts"></script>

    <script type="module" src="./panel.tsx"></script>
</body>

</html>

<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <title>脚本编辑器</title>
    <style>
        html,
        body {
            margin: 0;
            height: 100%;
            overflow: hidden;
        }

        #root {
            height: 100%;
        }
    </style>
    <!--
      冷启动防闪烁（FOUC）：在 React 挂载前同步读取持久化设置，提前应用主题类。
      独立窗不共享主窗 zustand store，且 React 的 useEffect 补主题发生在首次 paint
      之后，深色模式首帧会以浅色绘制（画板下方输出栏 var(--card) 渲染成白色块）。
      与 mainwindow.html 一致：同步读 localStorage['appSettings']，提前加 .dark/.theme-dark。
      所有窗口共用默认 session，localStorage 同源共享，能读到主窗写入的设置。
    -->
    <script>
        (function () {
            try {
                var raw = localStorage.getItem('appSettings')
                var s = raw ? JSON.parse(raw) : {}
                var el = document.documentElement
                if (s.dark) { el.classList.add('dark'); el.classList.add('theme-dark') }
                var fs = Number(s.fontSize)
                if (fs > 0) el.style.setProperty('--font-size-base', fs + 'px')
            } catch (e) { /* 容错：解析失败则用默认浅色 */ }
        })()
    </script>
</head>

<body>
    <div id="root"></div>
    <!-- Web 预览安全网：非 Electron 环境下注入 window.api shim（Electron 中 preload 已注入，此文件自动跳过） -->
    <script src="/src/shared/dev/mock-api.ts"></script>
    <script type="module" src="./script-editor.tsx"></script>
</body>

</html>

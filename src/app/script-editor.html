<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <title>脚本编辑器</title>
    <style>
        html,
        body {
            margin: 0;
            height: 100%;
            overflow: hidden;
        }

        #root {
            height: 100%;
        }
    </style>
    <!--
      注意：本文件不含任何内联 <script>。生产 CSP（installCsp, 见 electron/main.ts）
      script-src 为 'self'，内联脚本会被拦截（此前冷启动主题脚本失效、深色首帧闪白）。
      冷启动主题逻辑已移至 src/shared/dev/applyBootTheme.ts，由 script-editor.tsx 模块级 import。
    -->
</head>

<body>
    <div id="root"></div>
    <!-- Web 预览安全网：非 Electron 环境下注入 window.api shim（Electron 中 preload 已注入，此文件自动跳过） -->
    <script src="/src/shared/dev/mock-api.ts"></script>
    <script type="module" src="./script-editor.tsx"></script>
</body>

</html>

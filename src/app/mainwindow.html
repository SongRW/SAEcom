<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <title>串串</title>
    <!--
      注意：本文件不含任何内联 <script>/<style>。生产 CSP（installCsp, 见 electron/main.ts）
      script-src/style-src 均为 'self'，禁止内联——故冷启动主题、加载框样式与逻辑全部
      由 mainwindow.tsx（Vite 打包的同源模块，CSP 允许）注入。HTML 仅保留纯结构。
    -->
</head>

<body>
    <!--
      启动加载框：纯结构。样式由 mainwindow.tsx 注入的 <style> 提供；
      __hideAppLoader 由 mainwindow.tsx 暴露，渲染层首帧后调用（见 MainWindow.tsx）。
      默认配色走 CSS 变量 --loader-bg/--loader-fg（mainwindow.tsx 冷启动时按 localStorage 写入）。
    -->
    <div id="app-loader">
        <div class="loader-logo">串串</div>
        <div class="loader-spinner"></div>
        <div class="loader-text" id="app-loader-text">正在启动…</div>
    </div>

    <!-- React 主窗口挂载点（双轨并行：此入口独立于 legacy src/index.html） -->
    <div id="root"></div>

    <!-- Web 预览安全网：非 Electron 环境下注入 window.api shim（Electron 中 preload 已注入，此文件自动跳过） -->
    <script src="/src/shared/dev/mock-api.ts"></script>

    <script type="module" src="./mainwindow.tsx"></script>
</body>

</html>
